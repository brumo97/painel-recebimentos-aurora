name: Reorganiser les fichiers
on:
  push:
    paths: ['.github/workflows/reorganiser.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv painel-recebimentos-aurora/data data
          git mv painel-recebimentos-aurora/docs docs
          git mv painel-recebimentos-aurora/README.md README.md
          git commit -m "Range les fichiers a la racine"
          git push
